name: CI

on:
  push:
    branches:
      - mc1.21.1/fabric/dev
      - agent/mc1211-m3c-immediatelyfast-observation
  pull_request:
    branches:
      - mc1.21.1/fabric/dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out parity branch
        uses: actions/checkout@v4
        with:
          ref: agent/mc1211-m3c-immediatelyfast-observation
          fetch-depth: 0

      - name: Apply pending RenderLayer parity bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/dab2304f2dd922de2388cb46234b3657ca8dd576" \
            | jq -r '.content' \
            | tr -d '\n' \
            | base64 --decode \
            > /tmp/threadium-pending-parity.tar.gz
          echo '0d7bbc90ac195968d855a5200321bf4b9481a83cba4a606ccc2b04c1bae0af91  /tmp/threadium-pending-parity.tar.gz' \
            | sha256sum --check
          tar -xzf /tmp/threadium-pending-parity.tar.gz
          git diff --check
          if git diff --quiet && test -z "$(git status --porcelain --untracked-files=all)"; then
            echo 'Parity bundle is already applied.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/workflows/ci.yml src/backport1211
            git commit -m 'Expand 1.21.1 canonical RenderLayer support'
            git push origin HEAD:agent/mc1211-m3c-immediatelyfast-observation
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Validate Java 21 backport
        run: gradle --no-daemon clean spotlessApply spotlessCheck test build

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc1211-validation-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 3
          path: |
            build/reports
            build/test-results
            build/libs
