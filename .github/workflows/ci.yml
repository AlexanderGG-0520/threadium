name: CI

on:
  push:
    branches:
      - mc1.21.1/fabric/dev
  pull_request:
    branches:
      - mc1.21.1/fabric/dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Validate Java 21 backport
        run: gradle --no-daemon clean spotlessApply spotlessCheck test build

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc1211-validation-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 3
          path: |
            build/reports
            build/test-results
            build/libs
