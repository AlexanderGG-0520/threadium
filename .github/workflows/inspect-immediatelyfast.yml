name: Inspect ImmediatelyFast

on:
  pull_request:
    branches:
      - mc26.2/fabric/dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Resolve and inspect ImmediatelyFast
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspection
          gradle -Pthreadium.immediatelyfast --no-daemon dependencies --configuration clientRuntimeClasspath \
            > inspection/dependencies.txt 2>&1 || true
          find "$HOME/.gradle/caches/modules-2/files-2.1/maven.modrinth/5ZwdcRci/uJHxuQxy" \
            -type f -name '*.jar' -print > inspection/jars.txt
          jar_path="$(head -n 1 inspection/jars.txt)"
          test -n "$jar_path"
          jar tf "$jar_path" > inspection/classes.txt
          while IFS= read -r class_file; do
            class_name="${class_file%.class}"
            class_name="${class_name//\//.}"
            {
              printf '\n===== %s =====\n' "$class_name"
              javap -classpath "$jar_path" -p -c "$class_name" || true
            } >> inspection/javap.txt
          done < <(grep -E '\.class$' inspection/classes.txt | grep -Ei '(buffer|vertex|batch|immediate|consumer|source)' | head -n 200)

      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: immediatelyfast-inspection
          path: inspection

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: beta7-source-snapshot
          include-hidden-files: true
          path: |
            .github
            src
            build.gradle
            gradle.properties
            settings.gradle
