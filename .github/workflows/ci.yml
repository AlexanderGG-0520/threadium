name: CI

on:
  push:
    branches:
      - mc1.21.1/fabric/dev
  pull_request:
    branches:
      - mc1.21.1/fabric/dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Validate Java 21 backport
        run: gradle --no-daemon clean spotlessApply spotlessCheck test build

      - name: Collect Minecraft 1.21.1 shader references
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/minecraft-shader-reference
          while IFS= read -r archive; do
            if unzip -Z1 "$archive" 2>/dev/null | grep -q '^assets/minecraft/shaders/core/rendertype_entity'; then
              unzip -q -o "$archive" 'assets/minecraft/shaders/*' -d build/minecraft-shader-reference
            fi
          done < <(find "$HOME/.gradle/caches/fabric-loom" "$GITHUB_WORKSPACE/.gradle" \
            -type f -name '*.jar' 2>/dev/null | sort -u)

      - name: Upload validation workspace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc1211-validation-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 3
          path: |
            src/backport1211
            build.gradle
            gradle.properties
            settings.gradle
            build/minecraft-shader-reference
            build/reports
            build/test-results
            build/libs
