name: Trigger high-value 1.21.1 parity validation

on:
  pull_request:
    branches:
      - mc1.21.1/fabric/dev

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: mc1.21.1/fabric/dev
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Extract and apply production patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/ci.yml').read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validate implementation"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply_high_value.py').write_text(script)
          PY
          python /tmp/apply_high_value.py

      - name: Validate implementation
        run: gradle --no-daemon clean spotlessApply spotlessCheck test build

      - name: Publish validated production sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/backport1211/client/java/dev/alex/threadium/compat/IrisCompatibility.java \
            src/backport1211/client/java/dev/alex/threadium/render/entity/ModelPartReplacementService.java \
            src/backport1211/client/java/dev/alex/threadium/render/modelpart/pose/ModelPartPoseInspector.java \
            src/backport1211/main/java/dev/alex/threadium/render/modelpart/pose/ModelPartPoseTraversal.java \
            src/backport1211/test/java/dev/alex/threadium/compat/IrisCompatibilityTest.java \
            src/backport1211/test/java/dev/alex/threadium/render/modelpart/pose/ModelPartPoseHotPath1211Test.java
          git diff --cached --check
          git commit -m "Apply high-value 1.21.1 parity fixes"
          git push origin HEAD:mc1.21.1/fabric/dev
