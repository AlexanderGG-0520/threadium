name: Apply beta.7 runtime validation fix

on:
  pull_request:
    branches:
      - mc26.2/fabric/dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'fix/beta7-runtime-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/beta7-runtime-validation

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Apply and validate fixes
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply_beta7_runtime_fix.py
          gradle --no-daemon spotlessApply
          gradle --no-daemon clean spotlessCheck test build

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Fix beta.7 pass consolidation and production metrics"
          git push origin HEAD:fix/beta7-runtime-validation
