name: Apply beta.7 implementation

on:
  pull_request:
    branches:
      - mc26.2/fabric/dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'impl/beta7-render-hotpath'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: impl/beta7-render-hotpath

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Install implementation sources
        shell: bash
        run: |
          set -euo pipefail
          cat .github/beta7-bundle/part-*.b64 | base64 --decode > /tmp/beta7-files.tar.gz
          echo 'c59c77c06cccc1904407e2b490c6fa6ce110e9c86da7865b74bba53cf738ae80  /tmp/beta7-files.tar.gz' | sha256sum --check
          tar -xzf /tmp/beta7-files.tar.gz -C .
          gradle --no-daemon spotlessApply
          rm -rf .github/beta7-bundle .github/beta7-patch .github/workflows/inspect-immediatelyfast.yml

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Implement beta.7 ModelPart render hot path"
          git push origin HEAD:impl/beta7-render-hotpath
