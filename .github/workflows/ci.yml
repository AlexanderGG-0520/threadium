name: CI

on:
  push:
    branches:
      - agent/mc1201-backport
      - mc1.20.1/fabric/dev
  pull_request:
    branches:
      - mc1.20.1/fabric/dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21 for Loom
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Validate Java 17 backport
        run: gradle --no-daemon clean spotlessApply spotlessCheck test build
