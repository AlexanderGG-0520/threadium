name: Export Minecraft 1.21.1 outline workspace

on:
  pull_request:
    branches:
      - mc1.21.1/fabric/dev

permissions:
  contents: read

jobs:
  export-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out workspace branch
        uses: actions/checkout@v4

      - name: Package repository
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=/tmp/threadium-mc1211-outline-workspace.zip HEAD

      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: threadium-mc1211-outline-workspace
          path: /tmp/threadium-mc1211-outline-workspace.zip
          retention-days: 1
