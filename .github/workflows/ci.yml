name: CI

on:
  push:
    branches:
      - agent/mc1201-backport
      - mc1.20.1/fabric/dev
  pull_request:
    branches:
      - mc1.20.1/fabric/dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/mc1201-backport

      - name: Apply one-time 1.20.1 test adaptations
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              if old in text:
                  assert text.count(old) == 1, (path, text.count(old))
                  path.write_text(text.replace(old, new))
              else:
                  assert new in text, path

          material = Path('src/backport1211/test/java/dev/alex/threadium/render/modelpart/material/MaterialPathCharacterizerTest.java')
          replace_once(material, 'return paths.getFirst();', 'return paths.get(0);')

          pose = Path('src/backport1211/test/java/dev/alex/threadium/render/modelpart/pose/ModelPartVanillaPoseDifferentialTest.java')
          replace_once(
              pose,
              '        tree.root.render(root.matrices, consumer, 0x12345678, 0x23456789, 0xaabbccdd);',
              '''        tree.root.render(
                  root.matrices,
                  consumer,
                  0x12345678,
                  0x23456789,
                  0xBB / 255.0F,
                  0xCC / 255.0F,
                  0xDD / 255.0F,
                  0xAA / 255.0F);''')
          replace_once(
              pose,
              '            cuboid.renderCuboid(identity, consumer, 1, 2, 3);',
              '            cuboid.renderCuboid(identity, consumer, 1, 2, 1.0F, 1.0F, 1.0F, 1.0F);')
          replace_once(
              pose,
              '        public VertexConsumer vertex(float x, float y, float z) {',
              '        public VertexConsumer vertex(double x, double y, double z) {')

          text = pose.read_text()
          if '            capture.position(x, y, z);' in text:
              assert text.count('            capture.position(x, y, z);') == 1
              text = text.replace(
                  '            capture.position(x, y, z);',
                  '            capture.position((float) x, (float) y, (float) z);')
          else:
              assert '            capture.position((float) x, (float) y, (float) z);' in text
          if '''            this.x = x;
            this.y = y;
            this.z = z;''' in text:
              text = text.replace(
                  '''            this.x = x;
            this.y = y;
            this.z = z;''',
                  '''            this.x = (float) x;
            this.y = (float) y;
            this.z = (float) z;''')
          else:
              assert '''            this.x = (float) x;
            this.y = (float) y;
            this.z = (float) z;''' in text
          pose.write_text(text)

          replace_once(
              pose,
              '''        @Override
        public VertexConsumer normal(float x, float y, float z) {
            capture.normal(x, y, z);
            return this;
        }
    }

    private static final class ActualConsumer''',
              '''        @Override
        public VertexConsumer normal(float x, float y, float z) {
            capture.normal(x, y, z);
            return this;
        }

        @Override
        public void next() {}

        @Override
        public void fixedColor(int red, int green, int blue, int alpha) {
            throw new UnsupportedOperationException("Fixed colors are outside this differential test");
        }

        @Override
        public void unfixColor() {
            throw new UnsupportedOperationException("Fixed colors are outside this differential test");
        }
    }

    private static final class ActualConsumer''')
          replace_once(
              pose,
              '''        @Override
        public VertexConsumer normal(float normalX, float normalY, float normalZ) {
            vertices.add(new CapturedVertex(x, y, z, u, v, normalX, normalY, normalZ));
            return this;
        }
    }

    private record CapturedVertex''',
              '''        @Override
        public VertexConsumer normal(float normalX, float normalY, float normalZ) {
            vertices.add(new CapturedVertex(x, y, z, u, v, normalX, normalY, normalZ));
            return this;
        }

        @Override
        public void next() {}

        @Override
        public void fixedColor(int red, int green, int blue, int alpha) {
            throw new UnsupportedOperationException("Fixed colors are outside this differential test");
        }

        @Override
        public void unfixColor() {
            throw new UnsupportedOperationException("Fixed colors are outside this differential test");
        }
    }

    private record CapturedVertex''')

          temporary = Path('.github/workflows/patch-1201-tests.yml')
          if temporary.exists():
              temporary.unlink()

      - name: Commit source adaptations when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Adapt tests to Minecraft 1.20.1"
          git push origin HEAD:agent/mc1201-backport

      - name: Set up Java 21 for Loom
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Validate Java 17 backport
        run: gradle --no-daemon clean spotlessApply spotlessCheck test build
