org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Minecraft 1.20.1 backport: Loom runs on Java 21 while compiled artifacts target Java 17.
# Loom launch argument files live under build/ and are removed by clean; caching
# configureClientLaunch can otherwise leave runClient pointing at a missing file.
org.gradle.configuration-cache=false

minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
fabric_loader_version=0.16.14
fabric_api_version=0.92.11+1.20.1
loom_version=1.17.14
modmenu_version=7.2.2
mod_version=0.1.0-alpha.1+1.20.1
maven_group=dev.alex.threadium
archives_base_name=threadium
