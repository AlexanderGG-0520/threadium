name: Minecraft 1.21.1 glint reference

on:
  push:
    branches:
      - agent/mc1211-glint-reference
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out reference branch
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Extract exact glint references
        shell: bash
        run: |
          set -uo pipefail
          rm -rf tmp/glint-reference
          mkdir -p tmp/glint-reference/shaders

          set +e
          gradle --no-daemon genSources > tmp/glint-reference/genSources.log 2>&1
          printf '%s\n' "$?" > tmp/glint-reference/genSources.exit
          gradle --no-daemon classes > tmp/glint-reference/classes.log 2>&1
          printf '%s\n' "$?" > tmp/glint-reference/classes.exit
          set -e

          find "$HOME/.gradle" .gradle -type f -name '*.jar' -print 2>/dev/null \
            | sort > tmp/glint-reference/jars.txt

          : > tmp/glint-reference/source-candidates.txt
          : > tmp/glint-reference/client-candidates.txt
          while IFS= read -r candidate; do
            entries="$(unzip -Z1 "$candidate" 2>/dev/null || true)"
            if grep -q 'net/minecraft/client/render/RenderLayer.java' <<< "$entries"; then
              printf '%s\n' "$candidate" >> tmp/glint-reference/source-candidates.txt
            fi
            if grep -q 'assets/minecraft/shaders/core/rendertype_glint' <<< "$entries"; then
              printf '%s\n' "$candidate" >> tmp/glint-reference/client-candidates.txt
            fi
          done < tmp/glint-reference/jars.txt

          source_jar="$(head -n 1 tmp/glint-reference/source-candidates.txt || true)"
          if [[ -n "$source_jar" ]]; then
            for source in \
              net/minecraft/client/render/RenderLayer.java \
              net/minecraft/client/render/RenderPhase.java \
              net/minecraft/client/render/GameRenderer.java \
              net/minecraft/client/render/item/ItemRenderer.java \
              com/mojang/blaze3d/systems/RenderSystem.java; do
              if unzip -Z1 "$source_jar" 2>/dev/null | grep -qx "$source"; then
                unzip -p "$source_jar" "$source" > "tmp/glint-reference/$(basename "$source")"
              fi
            done
          fi

          client_jar="$(head -n 1 tmp/glint-reference/client-candidates.txt || true)"
          if [[ -n "$client_jar" ]]; then
            unzip -Z1 "$client_jar" \
              | grep -E '^assets/minecraft/shaders/(core|include)/.*(glint|fog).*\.(json|vsh|fsh|glsl)$' \
              | sort > tmp/glint-reference/shader-paths.txt || true
            while IFS= read -r shader; do
              [[ -n "$shader" ]] || continue
              target="tmp/glint-reference/shaders/${shader#assets/minecraft/shaders/}"
              mkdir -p "$(dirname "$target")"
              unzip -p "$client_jar" "$shader" > "$target"
            done < tmp/glint-reference/shader-paths.txt
          fi

          printf 'source_jar=%s\nclient_jar=%s\n' "$source_jar" "$client_jar" > tmp/glint-reference/origin.txt

      - name: Publish reference files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/glint-reference
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: capture Minecraft 1.21.1 glint references'
          git push origin HEAD:agent/mc1211-glint-reference
