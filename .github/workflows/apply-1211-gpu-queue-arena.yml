name: Apply 1.21.1 GPU queue arena

on:
  push:
    branches:
      - mc1.21.1/fabric/dev
    paths:
      - .github/workflows/apply-1211-gpu-queue-arena.yml
      - tools/apply_1211_gpu_queue_arena.py.gz.b64

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: mc1.21.1/fabric/dev

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Apply queue arena patch
        run: |
          base64 -d tools/apply_1211_gpu_queue_arena.py.gz.b64 | gzip -d > /tmp/apply_1211_gpu_queue_arena.py
          python /tmp/apply_1211_gpu_queue_arena.py

      - name: Validate implementation
        run: gradle --no-daemon clean spotlessApply spotlessCheck test build

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/backport1211/client/java/dev/alex/threadium/render/modelpart/ModelPartGpuInstanceBackend.java \
            src/backport1211/client/java/dev/alex/threadium/render/modelpart/QueuedModelPartArena1211.java \
            src/backport1211/test/java/dev/alex/threadium/render/modelpart/QueuedModelPartArena1211Test.java
          git diff --cached --check
          git commit -m "Pool 1.21.1 GPU queue entries"
          git push origin HEAD:mc1.21.1/fabric/dev
