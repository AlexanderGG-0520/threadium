name: CI

on:
  push:
    branches:
      - mc1.21.1/fabric/dev
  pull_request:
    branches:
      - mc1.21.1/fabric/dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Validate Java 21 backport
        run: gradle --no-daemon clean spotlessApply spotlessCheck test build

      - name: Collect 26.2 reference sources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reference-26.2
          git fetch --no-tags --depth=1 origin mc26.2/fabric/dev
          git archive origin/mc26.2/fabric/dev \
            src/main/java/dev/alex/threadium \
            src/main/resources \
            src/client/java/dev/alex/threadium \
            src/client/resources \
            src/test/java/dev/alex/threadium \
            | tar -x -C build/reference-26.2
          git show origin/mc26.2/fabric/dev:build.gradle > build/reference-26.2/build.gradle
          git show origin/mc26.2/fabric/dev:gradle.properties > build/reference-26.2/gradle.properties

      - name: Upload validation workspace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc1211-validation-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 3
          path: |
            src/backport1211
            build.gradle
            gradle.properties
            settings.gradle
            gradle
            gradlew
            gradlew.bat
            build/reference-26.2
            build/reports
            build/test-results
            build/libs
