name: Format readability cleanup

on:
  push:
    branches:
      - format/readability-cleanup-2026-07-17

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out formatting branch
        uses: actions/checkout@v4
        with:
          ref: format/readability-cleanup-2026-07-17
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle

      - name: Format Java sources
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon spotlessApply

      - name: Run automated tests
        run: ./gradlew --no-daemon test

      - name: Validate whitespace
        run: git diff --check

      - name: Commit formatted Java sources
        shell: bash
        run: |
          if git diff --quiet -- src; then
            echo "Java sources were already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src
          git commit -m "Format Java sources for readability"
          git push origin HEAD:format/readability-cleanup-2026-07-17
