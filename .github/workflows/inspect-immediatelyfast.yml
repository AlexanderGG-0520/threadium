name: Apply beta.7 implementation

on:
  pull_request:
    branches:
      - mc26.2/fabric/dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'impl/beta7-render-hotpath'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: impl/beta7-render-hotpath

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Apply implementation patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/beta7-patch/part-*.b64 | base64 --decode > /tmp/beta7.patch
          patch --batch --forward -p1 < /tmp/beta7.patch
          gradle --no-daemon spotlessApply
          rm -rf .github/beta7-patch .github/workflows/inspect-immediatelyfast.yml

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Implement beta.7 ModelPart render hot path"
          git push origin HEAD:impl/beta7-render-hotpath
