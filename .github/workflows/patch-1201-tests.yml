name: Patch 1.20.1 tests

on:
  push:
    branches:
      - agent/mc1201-backport
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          ref: agent/mc1201-backport

      - name: Adapt differential tests to Java 17 and Minecraft 1.20.1
        shell: python
        run: |
          from pathlib import Path

          material = Path('src/backport1211/test/java/dev/alex/threadium/render/modelpart/material/MaterialPathCharacterizerTest.java')
          text = material.read_text()
          old = 'return paths.getFirst();'
          assert text.count(old) == 1
          material.write_text(text.replace(old, 'return paths.get(0);'))

          pose = Path('src/backport1211/test/java/dev/alex/threadium/render/modelpart/pose/ModelPartVanillaPoseDifferentialTest.java')
          text = pose.read_text()

          old = '        tree.root.render(root.matrices, consumer, 0x12345678, 0x23456789, 0xaabbccdd);'
          new = '''        tree.root.render(
                  root.matrices,
                  consumer,
                  0x12345678,
                  0x23456789,
                  0xBB / 255.0F,
                  0xCC / 255.0F,
                  0xDD / 255.0F,
                  0xAA / 255.0F);'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '            cuboid.renderCuboid(identity, consumer, 1, 2, 3);'
          new = '            cuboid.renderCuboid(identity, consumer, 1, 2, 1.0F, 1.0F, 1.0F, 1.0F);'
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '        public VertexConsumer vertex(float x, float y, float z) {'
          assert text.count(old) == 2
          text = text.replace(old, '        public VertexConsumer vertex(double x, double y, double z) {')

          old = '            capture.position(x, y, z);'
          assert text.count(old) == 1
          text = text.replace(old, '            capture.position((float) x, (float) y, (float) z);')

          old = '''            this.x = x;
            this.y = y;
            this.z = z;'''
          new = '''            this.x = (float) x;
            this.y = (float) y;
            this.z = (float) z;'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''        @Override
        public VertexConsumer normal(float x, float y, float z) {
            capture.normal(x, y, z);
            return this;
        }
    }

    private static final class ActualConsumer'''
          new = '''        @Override
        public VertexConsumer normal(float x, float y, float z) {
            capture.normal(x, y, z);
            return this;
        }

        @Override
        public void next() {}

        @Override
        public void fixedColor(int red, int green, int blue, int alpha) {
            throw new UnsupportedOperationException("Fixed colors are outside this differential test");
        }

        @Override
        public void unfixColor() {
            throw new UnsupportedOperationException("Fixed colors are outside this differential test");
        }
    }

    private static final class ActualConsumer'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''        @Override
        public VertexConsumer normal(float normalX, float normalY, float normalZ) {
            vertices.add(new CapturedVertex(x, y, z, u, v, normalX, normalY, normalZ));
            return this;
        }
    }

    private record CapturedVertex'''
          new = '''        @Override
        public VertexConsumer normal(float normalX, float normalY, float normalZ) {
            vertices.add(new CapturedVertex(x, y, z, u, v, normalX, normalY, normalZ));
            return this;
        }

        @Override
        public void next() {}

        @Override
        public void fixedColor(int red, int green, int blue, int alpha) {
            throw new UnsupportedOperationException("Fixed colors are outside this differential test");
        }

        @Override
        public void unfixColor() {
            throw new UnsupportedOperationException("Fixed colors are outside this differential test");
        }
    }

    private record CapturedVertex'''
          assert text.count(old) == 1
          pose.write_text(text.replace(old, new))

          Path('.github/workflows/patch-1201-tests.yml').unlink()

      - name: Commit adapted tests
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Adapt tests to Minecraft 1.20.1"
          git push origin HEAD:agent/mc1201-backport
