name: CI

on:
  push:
    branches:
      - mc26.2/fabric/dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: mc26.2/fabric/dev

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Apply Java formatting
        run: gradle --no-daemon spotlessApply

      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/java src/test/java
          if ! git diff --cached --quiet; then
            git commit -m "Apply Spotless formatting"
            git push origin HEAD:mc26.2/fabric/dev
          fi
