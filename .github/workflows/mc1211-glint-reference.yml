name: Minecraft 1.21.1 glint reference

on:
  push:
    branches:
      - agent/mc1211-glint-reference
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out reference branch
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Generate mapped Minecraft sources
        run: gradle --no-daemon genSources

      - name: Extract exact glint references
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp/glint-reference
          mkdir -p tmp/glint-reference/shaders

          source_jar=""
          while IFS= read -r candidate; do
            if unzip -l "$candidate" 2>/dev/null | grep -q 'net/minecraft/client/render/RenderLayer.java'; then
              source_jar="$candidate"
              break
            fi
          done < <(find "$HOME/.gradle/caches" -type f -name '*sources*.jar' -print)
          test -n "$source_jar"

          for source in \
            net/minecraft/client/render/RenderLayer.java \
            net/minecraft/client/render/RenderPhase.java \
            net/minecraft/client/render/GameRenderer.java \
            net/minecraft/client/render/item/ItemRenderer.java \
            com/mojang/blaze3d/systems/RenderSystem.java; do
            if unzip -l "$source_jar" "$source" 2>/dev/null | grep -q "$source"; then
              unzip -p "$source_jar" "$source" > "tmp/glint-reference/$(basename "$source")"
            fi
          done

          client_jar=""
          while IFS= read -r candidate; do
            if unzip -l "$candidate" 2>/dev/null | grep -q 'assets/minecraft/shaders/core/rendertype_glint'; then
              client_jar="$candidate"
              break
            fi
          done < <(find "$HOME/.gradle/caches" -type f -name '*.jar' -print)
          test -n "$client_jar"

          unzip -Z1 "$client_jar" \
            | grep -E '^assets/minecraft/shaders/(core|include)/.*(glint|fog).*\.(json|vsh|fsh|glsl)$' \
            | sort > tmp/glint-reference/shader-paths.txt
          while IFS= read -r shader; do
            target="tmp/glint-reference/shaders/${shader#assets/minecraft/shaders/}"
            mkdir -p "$(dirname "$target")"
            unzip -p "$client_jar" "$shader" > "$target"
          done < tmp/glint-reference/shader-paths.txt

          printf 'source_jar=%s\nclient_jar=%s\n' "$source_jar" "$client_jar" > tmp/glint-reference/origin.txt

      - name: Publish reference files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/glint-reference
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: capture Minecraft 1.21.1 glint references'
          git push origin HEAD:agent/mc1211-glint-reference
