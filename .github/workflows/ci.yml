name: CI

on:
  push:
    branches:
      - mc26.2/fabric/dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Apply Java formatting
        run: gradle --no-daemon spotlessApply

      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: formatted-sources
          path: |
            src/client/java/dev/alex/threadium
            src/test/java/dev/alex/threadium

      - name: Verify formatting is committed
        run: git diff --exit-code
