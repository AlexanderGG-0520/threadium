name: MC 1.21.1 translucent sort driver

on:
  push:
    branches:
      - agent/mc1211-translucent-sort-driver
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out 1.21.1 development branch
        uses: actions/checkout@v4
        with:
          ref: mc1.21.1/fabric/dev
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Apply and validate translucent sorting implementation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/d94e8e36890f7a68ae59f12d86c36b4f432275d2" \
            | jq -r '.content' \
            | tr -d '\n' \
            | base64 --decode \
            > /tmp/mc1211-translucent-sort.tar.gz
          echo '2d9e9fdf959bb6fd151d1e02bb49929353600448b5a8092bea3cf374b5aa0111  /tmp/mc1211-translucent-sort.tar.gz' \
            | sha256sum --check
          tar -xzf /tmp/mc1211-translucent-sort.tar.gz
          git diff --check
          gradle --no-daemon spotlessApply clean spotlessCheck test build
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c agent/mc1211-translucent-quad-sort
          git add src/backport1211
          git commit -m 'Implement 1.21.1 translucent quad sorting'
          git push origin HEAD:agent/mc1211-translucent-quad-sort

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc1211-translucent-sort-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 3
          path: |
            build/reports
            build/test-results
            build/libs
